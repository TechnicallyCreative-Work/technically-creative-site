# Disabled: the site now has server-rendered routes (/login, /account,
# /api/*) that GitHub Pages — static-file-only hosting — cannot serve. Auto-
# deploying here would silently publish a broken duplicate site (marketing
# pages fine, everything new 404ing) at the old Pages URL. Hosting has moved
# to Netlify (see astro.config.ts adapter + netlify.toml). Re-enable the
# `push` trigger below only if this site goes back to being fully static.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
