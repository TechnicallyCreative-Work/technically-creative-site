site:
  name: 'Technically Creative'
  site: 'https://technicallycreative.work'
  base: '/'
  trailingSlash: false
  googleSiteVerificationId: false

metadata:
  title:
    default: 'Technically Creative'
    template: '%s - Technically Creative'
  description: 'Creative audio, project leadership, workflow automation, and workshops that keep your launches on schedule.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'Technically Creative'
    images:
      - url: '~/assets/images/og-default.jpg'
        width: 1200
        height: 628
  twitter:
    card: 'summary_large_image'

apps:
  blog:
    isEnabled: true
    postsPerPage: 9
    isRelatedPostsEnabled: true
    relatedPostsCount: 3
    post:
      isEnabled: true
      permalink: '/news/%slug%'
      robots:
        index: true
        follow: true
    list:
      isEnabled: true
      pathname: 'news'
      robots:
        index: true
        follow: true
    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true
        follow: true
    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false
        follow: true

i18n:
  language: 'en'
  textDirection: 'ltr'

ui:
  theme: 'system' # light | dark | system
  nav:
    showSocialIcons: true
    showThemeToggle: true

features:
  rss: false
  sitemap: true
  analytics: false
